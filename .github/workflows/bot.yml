name: Run Tesla Telegram Bot

on:
  schedule:
    - cron: '0 * * * *' # Draait elk uur automatisch
  workflow_dispatch:      # Geeft ook een knop om hem handmatig te starten

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot script
        run: python main.py

